name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG"       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION"

      - name: Validate manifests
        run: |
          python3 -c "import json,sys; json.load(open('.codex-plugin/plugin.json')); json.load(open('.claude-plugin/plugin.json')); json.load(open('.claude-plugin/marketplace.json')); json.load(open('.agents/plugins/marketplace.json')); print('All manifests valid JSON')"
          python3 -m py_compile skills/superplan/scripts/superplan.py && echo "Controller compiles" 

      - name: Package plugin components
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          STAGE="superplan-plugin-${VERSION}"
          DEST="dist/${STAGE}"
          mkdir -p "$DEST"

          # ---- Codex host components ----
          mkdir -p "$DEST/.codex-plugin" "$DEST/.agents/plugins"
          cp .codex-plugin/plugin.json           "$DEST/.codex-plugin/"
          cp .agents/plugins/marketplace.json    "$DEST/.agents/plugins/"

          # ---- Claude Code host components ----
          mkdir -p "$DEST/.claude-plugin"
          cp .claude-plugin/plugin.json          "$DEST/.claude-plugin/"
          cp .claude-plugin/marketplace.json     "$DEST/.claude-plugin/"

          # ---- Shared hooks ----
          mkdir -p "$DEST/hooks"
          cp hooks/hooks.json                    "$DEST/hooks/"
          cp hooks/claude-failure-hooks.json     "$DEST/hooks/"

          # ---- Skills (definition, agent config, controller, templates) ----
          mkdir -p "$DEST/skills/superplan/agents" \
                   "$DEST/skills/superplan/scripts" \
                   "$DEST/skills/superplan/templates"
          cp skills/superplan/SKILL.md              "$DEST/skills/superplan/"
          cp skills/superplan/agents/openai.yaml   "$DEST/skills/superplan/agents/"
          cp skills/superplan/scripts/superplan.py "$DEST/skills/superplan/scripts/"
          cp skills/superplan/templates/findings.md \
             skills/superplan/templates/progress.md \
             skills/superplan/templates/task_plan.md \
             "$DEST/skills/superplan/templates/"

          # ---- Documentation ----
          cp README.md README.zh-CN.md CHANGELOG.md LICENSE "$DEST/"

          # ---- Verify all required files are present ----
          for f in \
            .codex-plugin/plugin.json \
            .claude-plugin/plugin.json \
            .claude-plugin/marketplace.json \
            .agents/plugins/marketplace.json \
            hooks/hooks.json \
            hooks/claude-failure-hooks.json \
            skills/superplan/SKILL.md \
            skills/superplan/agents/openai.yaml \
            skills/superplan/scripts/superplan.py \
            skills/superplan/templates/findings.md \
            skills/superplan/templates/progress.md \
            skills/superplan/templates/task_plan.md \
            README.md \
            README.zh-CN.md \
            CHANGELOG.md \
            LICENSE; do
            test -f "$DEST/$f" || { echo "ERROR: missing required file: $f"; exit 1; }
          done

          # ---- Verify no dev-only artifacts leaked in ----
          for d in tests .github __pycache__ .planning; do
            test ! -e "$DEST/$d" || { echo "ERROR: $d/ should not be in package"; exit 1; }
          done
          test ! -f "$DEST/.gitignore" || { echo "ERROR: .gitignore should not be in package"; exit 1; }
          ! find "$DEST" -name '__pycache__' -o -name '*.pyc' | grep -q . \
            || { echo "ERROR: Python cache files found"; exit 1; }

          echo "All checks passed — package is clean."

          # ---- Archive ----
          cd dist
          tar -czf "${STAGE}.tar.gz" "${STAGE}"
          zip -qr "${STAGE}.zip" "${STAGE}"
          sha256sum "${STAGE}.tar.gz" "${STAGE}.zip" > checksums-sha256.txt

          echo "=== Package contents ==="
          find "${STAGE}" -type f | sort
          echo "=== Archives ==="
          ls -la

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          BODY="$(python3 - "$VERSION" <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          # Match a "## <version>" heading (with or without leading 'v').
          pat = re.compile(r"^##\s*v?" + re.escape(version) + r"\b\s*\n(.*?)(?=^##\s|\Z)", re.M | re.S)
          m = pat.search(text)
          if m:
              print(m.group(1).strip())
          PY
          )"
          if [ -z "$BODY" ]; then BODY="Release ${VERSION} of the Superplan dual-host (Codex + Claude Code) plugin. See CHANGELOG.md for details."; fi
          {
            echo "BODY<<EOF_DELIM"
            echo "$BODY"
            echo "EOF_DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: ${{ steps.notes.outputs.BODY }}
          files: |
            dist/superplan-plugin-*.tar.gz
            dist/superplan-plugin-*.zip
            dist/checksums-sha256.txt
          generate_release_notes: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
