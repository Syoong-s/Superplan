name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG"       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION"

      - name: Validate manifests
        run: |
          python3 -c "import json,sys; json.load(open('.codex-plugin/plugin.json')); json.load(open('.claude-plugin/plugin.json')); json.load(open('.claude-plugin/marketplace.json')); json.load(open('.agents/plugins/marketplace.json')); print('All manifests valid JSON')"
          python3 -m py_compile skills/superplan/scripts/superplan.py && echo "Controller compiles"
          python3 -m unittest discover -s tests -v

      - name: Package plugin directory
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          STAGE="superplan-plugin-${VERSION}"
          mkdir -p "dist/${STAGE}"
          # Ship the whole plugin directory, excluding dev/runtime/VCS files only.
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='dist' \
            --exclude='.planning' \
            --exclude='.superplan.json' \
            --exclude='.superplan.lock' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='*.bak' \
            --exclude='*.orig' \
            ./ "dist/${STAGE}/"
          # Sanity: both host manifests must be inside the package.
          test -f "dist/${STAGE}/.codex-plugin/plugin.json"
          test -f "dist/${STAGE}/.claude-plugin/plugin.json"
          test -f "dist/${STAGE}/hooks/hooks.json"
          test -f "dist/${STAGE}/skills/superplan/scripts/superplan.py"
          cd dist
          tar -czf "${STAGE}.tar.gz" "${STAGE}"
          zip -qr "${STAGE}.zip" "${STAGE}"
          sha256sum "${STAGE}.tar.gz" "${STAGE}.zip" > checksums-sha256.txt
          ls -la

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          BODY="$(python3 - "$VERSION" <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          # Match a "## <version>" heading (with or without leading 'v').
          pat = re.compile(r"^##\s*v?" + re.escape(version) + r"\b\s*\n(.*?)(?=^##\s|\Z)", re.M | re.S)
          m = pat.search(text)
          if m:
              print(m.group(1).strip())
          PY
          )"
          if [ -z "$BODY" ]; then BODY="Release ${VERSION} of the Superplan dual-host (Codex + Claude Code) plugin. See CHANGELOG.md for details."; fi
          {
            echo "BODY<<EOF_DELIM"
            echo "$BODY"
            echo "EOF_DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: ${{ steps.notes.outputs.BODY }}
          files: |
            dist/superplan-plugin-*.tar.gz
            dist/superplan-plugin-*.zip
            dist/checksums-sha256.txt
          generate_release_notes: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
